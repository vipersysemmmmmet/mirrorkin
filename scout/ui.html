<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny You Scout</title>
<style>
  :root {
    --bg: #c1a03f; --card: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e2dd;
    --accent: #5b4bdb; --accent-soft: #ecebfc; --good: #1f8a4c; --good-soft: #e3f4ea;
    --bad: #c2412d; --bad-soft: #fbe9e5; --bubble: #5b4bdb; --bubble-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1e1e22; --ink: #f2f2f4; --muted: #9a9aa2; --line: #2e2e34;
      --accent: #8f83ff; --accent-soft: #2a2747; --good: #4cc27f; --good-soft: #17301f;
      --bad: #f07a65; --bad-soft: #3a1f1a; --bubble: #4a3fc0; --bubble-ink: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--accent);
            color: #fff; display: grid; place-items: center; font-size: 26px; flex: none; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 32px 0 12px; }
  .sub { color: var(--muted); font-size: 13px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .chip.ok { background: var(--good-soft); color: var(--good); }
  .chip.no { background: var(--bad-soft); color: var(--bad); }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select, input[type=text] { font: inherit; color: var(--ink); background: var(--bg);
           border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  select { max-width: 100%; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer;
           background: var(--accent); color: #fff; }
  button.ghost { background: var(--accent-soft); color: var(--accent); }
  button.good { background: var(--good); }
  button.bad { background: var(--bad); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .error { color: var(--bad); margin-top: 10px; font-size: 14px; }
  .bubble { background: var(--bubble); color: var(--bubble-ink); border-radius: 18px 18px 18px 4px;
            padding: 14px 16px; max-width: 560px; white-space: pre-wrap; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .stat b { display: block; font-size: 20px; }
  .stat span { color: var(--muted); font-size: 12px; }
  .opp { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .opp-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .opp h3 { font-size: 16px; margin: 0 0 4px; }
  .profit { text-align: right; flex: none; }
  .profit b { font-size: 20px; color: var(--good); display: block; }
  .profit span { font-size: 12px; color: var(--muted); }
  .meta { color: var(--muted); font-size: 13px; margin: 6px 0; }
  .opp p { margin: 6px 0; }
  .next { font-size: 14px; }
  .opp a { color: var(--accent); word-break: break-all; font-size: 13px; }
  .review { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .review input { flex: 1; min-width: 160px; }
  .decided { margin-top: 12px; font-size: 14px; font-weight: 600; }
  .decided.yes { color: var(--good); } .decided.no { color: var(--bad); }
  ul.plain { margin: 0; padding-left: 18px; }
  ul.plain li { margin: 4px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; font-weight: 600; }
  .empty { color: var(--muted); }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main>
  <header>
    <div class="avatar" aria-hidden="true">🙂</div>
    <div>
      <h1>Tiny you · Scout</h1>
      <div class="chips" id="status"></div>
    </div>
  </header>

  <div class="panel">
    <div class="controls">
      <select id="file" aria-label="Saved results file"></select>
      <button class="ghost" id="runFile">Run from file</button>
      <button id="runLive">Run live scout</button>
    </div>
    <div class="sub" id="hint" style="margin-top:8px"></div>
    <div class="error" id="error" hidden></div>
  </div>

  <div id="content"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = (u) => /^https?:\/\//i.test(u) ? esc(u) : "#";
const money = (n) => "$" + Math.round(n).toLocaleString();

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  } : undefined);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Something went wrong");
  return data;
}

function showError(msg) { $("error").hidden = !msg; $("error").textContent = msg || ""; }

function render(s) {
  $("status").innerHTML = [
    `<span class="chip ${s.has_profile ? "ok" : "no"}">${s.has_profile ? "Profile ready" : "No profile.json"}</span>`,
    `<span class="chip ${s.has_key ? "ok" : "no"}">${s.has_key ? "API key set" : "No API key"}</span>`,
    s.run_date ? `<span class="chip">Last run ${esc(s.run_date)}</span>` : ""
  ].join("");

  const sel = $("file"), prev = sel.value;
  sel.innerHTML = s.result_files.map((f) => `<option>${esc(f)}</option>`).join("") ||
    "<option value=''>No saved results</option>";
  if (s.result_files.includes(prev)) sel.value = prev;
  $("runFile").disabled = !s.has_profile || !s.result_files.length;
  $("runLive").disabled = !s.has_profile || !s.has_key;
  $("hint").textContent = !s.has_profile
    ? "Copy profile.example.json to profile.json first."
    : !s.has_key ? "Live runs need an Anthropic API key in .env. Files work without one." : "A live run takes a few minutes.";

  const r = s.run;
  if (!r) { $("content").innerHTML = `<h2>No runs yet</h2><p class="empty">Run from a file or a live scout to see tiny you's finds here.</p>`; return; }

  const opps = r.opportunities, decided = opps.filter((o) => o.decision);
  const approved = decided.filter((o) => o.decision.approved).length;
  const total = opps.reduce((a, o) => a + o.expected_profit, 0);

  let html = `<h2>Text from tiny you</h2><div class="bubble">${esc(r.daily_text)}</div>
    <div class="stats">
      <div class="stat"><b>${opps.length}</b><span>finds</span></div>
      <div class="stat"><b>${money(total)}</b><span>expected, all finds</span></div>
      <div class="stat"><b>${approved}/${decided.length}</b><span>approved / reviewed</span></div>
      <div class="stat"><b>${r.blocked.length}</b><span>blocked by rules</span></div>
    </div>`;

  html += `<h2>Opportunities, best first</h2>`;
  html += opps.map((o, i) => `
    <div class="opp">
      <div class="opp-top">
        <div>
          <h3>${esc(o.title)}</h3>
          <span class="chip">${esc(o.kind)}</span>
        </div>
        <div class="profit">${o.pay_usd > 0
          ? `<b>${money(o.expected_profit)}</b><span>expected</span>`
          : `<b>?</b><span>amount unknown</span>`}</div>
      </div>
      <div class="meta">${o.pay_usd > 0 ? `Pays ${money(o.pay_usd)}` : "Pay unknown"} × ${Math.round(o.success_chance * 100)}% chance − ${money(o.cost_usd)} cost
        · your time ${esc(o.human_hours)}h · done by ${esc(o.who_does_it)}${o.deadline ? " · due " + esc(o.deadline) : ""}</div>
      <p>${esc(o.summary)}</p>
      <p class="next"><b>Next:</b> ${esc(o.next_step)}</p>
      ${o.risk_flags.length ? `<p class="meta">⚠ ${o.risk_flags.map(esc).join(", ")}</p>` : ""}
      <a href="${safeUrl(o.url)}" target="_blank" rel="noopener noreferrer">${esc(o.url)}</a>
      ${o.decision
        ? `<div class="decided ${o.decision.approved ? "yes" : "no"}">${o.decision.approved ? "✓ Approved" : "✕ Rejected"}${o.decision.reason ? " · " + esc(o.decision.reason) : ""}</div>`
        : `<div class="review">
             <input type="text" id="why${i}" placeholder="Why? (optional, helps it learn)">
             <button class="good" data-i="${i}" data-a="1">Approve</button>
             <button class="bad" data-i="${i}" data-a="0">Reject</button>
           </div>`}
    </div>`).join("") || `<p class="empty">Nothing passed the rules this run.</p>`;

  html += `<h2>Ideas it came up with</h2><div class="panel"><ul class="plain">${
    r.ideas.map((x) => `<li><b>${esc(x.idea)}</b>: ${esc(x.why_it_fits)}</li>`).join("")}</ul></div>`;

  if (r.blocked.length) {
    html += `<h2>Blocked by the rules</h2><div class="panel"><ul class="plain">${
      r.blocked.map((b) => `<li><b>${esc(b.title)}</b>: ${b.blocked_because.map(esc).join(", ")}</li>`).join("")}</ul></div>`;
  }

  const m = s.memory;
  const sources = Object.entries(m.sources).sort((a, b) => (b[1].approved - b[1].rejected) - (a[1].approved - a[1].rejected));
  html += `<h2>What tiny you remembers</h2><div class="panel">
    <details open><summary>Sources (${sources.length})</summary>
      <table><thead><tr><th>Source</th><th>What</th><th class="n">Found</th><th class="n">✓</th><th class="n">✕</th></tr></thead><tbody>${
        sources.map(([name, x]) => `<tr><td>${esc(name)}</td><td>${esc(x.what)}</td><td class="n">${x.found}</td><td class="n">${x.approved}</td><td class="n">${x.rejected}</td></tr>`).join("")
      }</tbody></table>
    </details>
    <details style="margin-top:12px"><summary>Lessons (${m.lessons.length})</summary>
      <ul class="plain">${m.lessons.map((l) => `<li>${esc(l)}</li>`).join("") || "<li class='empty'>None yet</li>"}</ul>
    </details>
  </div>`;

  $("content").innerHTML = html;
}

async function refresh() { render(await api("/api/state")); }

async function busy(btn, label, fn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = label; showError("");
  try { render(await fn()); } catch (e) { showError(e.message); await refresh(); }
  finally { btn.textContent = old; }
}

$("runFile").onclick = (e) => busy(e.target, "Running…", () => api("/api/run", { file: $("file").value }));
$("runLive").onclick = (e) => busy(e.target, "Scouting… (a few minutes)", () => api("/api/run", {}));
$("content").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-i]");
  if (!b) return;
  const i = +b.dataset.i;
  busy(b, "Saving…", () => api("/api/feedback", { index: i, approved: b.dataset.a === "1", reason: $("why" + i).value }));
});

refresh().catch((e) => showError(e.message));
</script>
</body>
</html>
